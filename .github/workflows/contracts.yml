name: contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install jsonschema==4.26.0

      - name: Validate shared contracts
        run: python3 contracts/validate_contracts.py

      # Branch convention from AGENTS.md: a/* b/* c/* are students, sup/* is the supervisor.
      - name: Block student PRs that change a shared contract
        if: github.event_name == 'pull_request'
        run: |
          HEAD_REF="${{ github.head_ref }}"
          case "$HEAD_REF" in
            sup/*) echo "Supervisor branch - contract change allowed."; exit 0 ;;
          esac
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -q '^contracts/.*\.schema\.json$'; then
            echo "::error::This PR changes a shared contract."
            echo "Contract changes need explicit supervisor review before any module builds against them."
            echo "If you needed a field that is not here, that is the conversation to have - not a silent fork."
            echo "Open a sup/ branch through the supervisor instead."
            exit 1
          fi

      - name: Enforce module path ownership
        if: github.event_name == 'pull_request'
        run: |
          HEAD_REF="${{ github.head_ref }}"
          case "$HEAD_REF" in sup/*) echo "Supervisor branch - no path limit."; exit 0 ;; esac
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          OWNER=""
          case "$HEAD_REF" in
            a/*) OWNER='^(packages/tracker|packages/fitness)/' ;;
            b/*) OWNER='^apps/mobile/' ;;
            c/*) OWNER='^server/' ;;
            *) echo "::error::Unrecognised branch prefix: $HEAD_REF"; exit 1 ;;
          esac
          BAD=$(echo "$CHANGED" | grep -Ev "$OWNER" || true)
          if [ -n "$BAD" ]; then
            echo "::error::This branch may only modify paths matching $OWNER"
            echo "Offending files:"; echo "$BAD"
            exit 1
          fi
